<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple dynamic blog powered by an API" />
    <title>Ink & Ideas | Blog</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <nav class="nav">
        <a class="brand" href="/">Ink<span>&</span>Ideas</a>
        <a class="about" href="#posts">Explore posts ↓</a>
      </nav>
      <div class="hero-copy">
        <p class="eyebrow">A little space for big ideas</p>
        <h1>Stories worth<br /><em>sticking with.</em></h1>
        <p class="intro">Thoughts, lessons, and fresh perspectives from our community.</p>
      </div>
    </header>

    <main id="posts" class="content">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Latest from the blog</p>
          <h2>Freshly written</h2>
        </div>
        <label class="search">
          <span>⌕</span>
          <input id="search-input" type="search" placeholder="Search posts..." aria-label="Search posts" />
        </label>
      </div>
      <p id="status" class="status">Loading stories...</p>
      <section id="post-list" class="post-grid" aria-live="polite"></section>
    </main>

    <footer>Made for curious minds · <span id="year"></span></footer>
  </body>
</html>
